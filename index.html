<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position Sizing Calculator - 포지션 사이징 계산기</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }
    
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-white dark:bg-black text-neutral-900 dark:text-neutral-50 antialiased selection:bg-neutral-900 selection:text-white dark:selection:bg-white dark:selection:text-black transition-colors duration-200">

  <!-- Top Navigation Bar -->
  <nav class="border-b border-neutral-200 dark:border-neutral-800 bg-white/90 dark:bg-black/90 backdrop-blur-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <svg class="w-6 h-6 text-neutral-900 dark:text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>
        </svg>
        <span class="font-bold text-lg tracking-tight">Position Sizing Calculator</span>
      </div>
      <button 
        id="theme-toggle"
        aria-label="테마 전환"
        class="p-2.5 rounded-xl bg-neutral-100 dark:bg-neutral-900 hover:bg-neutral-200 dark:hover:bg-neutral-800 border border-neutral-200 dark:border-neutral-800 transition-colors"
      >
        <!-- Sun Icon (shown in dark mode) -->
        <svg id="icon-sun" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg id="icon-moon" class="w-5 h-5 text-black hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8 md:py-12">
    
    <!-- Main Emphasized Headline -->
    <div class="mb-8 md:mb-10">
      <h1 class="text-4xl sm:text-6xl md:text-7xl font-black tracking-tight text-neutral-900 dark:text-white leading-tight">
        몇 주를 사야할까?
      </h1>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
      
      <!-- LEFT COLUMN: STEP 1 & STEP 2 Inputs -->
      <div class="lg:col-span-5 space-y-5">
        
        <!-- STEP 1: Market & Direction Selection -->
        <div class="bg-neutral-50 dark:bg-neutral-950 rounded-2xl p-5 sm:p-6 border border-neutral-200 dark:border-neutral-800">
          <div class="grid grid-cols-3 gap-2 mb-3" id="market-buttons">
            <button data-market="KR" class="market-btn py-3 px-2 rounded-xl font-bold text-sm transition-all bg-white dark:bg-neutral-900 text-neutral-500 border border-neutral-200 dark:border-neutral-800">
              국내주식(₩)
            </button>
            <button data-market="US" class="market-btn py-3 px-2 rounded-xl font-bold text-sm transition-all bg-neutral-900 text-white dark:bg-white dark:text-black shadow-sm">
              미국주식($)
            </button>
            <button data-market="CRYPTO" class="market-btn py-3 px-2 rounded-xl font-bold text-sm transition-all bg-white dark:bg-neutral-900 text-neutral-500 border border-neutral-200 dark:border-neutral-800">
              암호화폐(USDT)
            </button>
          </div>

          <div class="grid grid-cols-2 gap-2" id="position-buttons">
            <button data-pos="LONG" class="pos-btn py-3 rounded-xl font-bold text-sm transition-all border-2 border-emerald-500 text-emerald-600 dark:text-emerald-400 bg-emerald-500/10">
              롱 (Long)
            </button>
            <button data-pos="SHORT" class="pos-btn py-3 rounded-xl font-bold text-sm transition-all border-2 border-transparent text-neutral-500 bg-white dark:bg-neutral-900 border-neutral-200 dark:border-neutral-800">
              숏 (Short)
            </button>
          </div>
        </div>

        <!-- STEP 2: Core Numeric Inputs -->
        <div class="bg-neutral-50 dark:bg-neutral-950 rounded-2xl p-5 sm:p-6 border border-neutral-200 dark:border-neutral-800 space-y-4">
          
          <!-- Balance & Leverage -->
          <div class="grid grid-cols-12 gap-3">
            <div class="col-span-8">
              <label id="balance-label" class="block text-xs font-bold tracking-wider text-neutral-500 dark:text-neutral-400 mb-1.5">
                현재 잔고 ($)
              </label>
              <input
                id="input-balance"
                type="text"
                inputmode="decimal"
                value="1,000"
                class="w-full bg-white dark:bg-black border border-neutral-200 dark:border-neutral-800 rounded-xl py-3.5 px-3.5 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white transition-all"
                placeholder="0"
              />
            </div>
            <div class="col-span-4">
              <label class="block text-xs font-bold tracking-wider text-neutral-500 dark:text-neutral-400 mb-1.5">
                레버리지
              </label>
              <div class="relative">
                <input
                  id="input-leverage"
                  type="text"
                  inputmode="decimal"
                  value="1"
                  disabled
                  class="w-full bg-white dark:bg-black border border-neutral-200 dark:border-neutral-800 rounded-xl py-3.5 pl-3 pr-7 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white disabled:opacity-40 transition-all"
                />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 font-bold text-sm">X</span>
              </div>
            </div>
          </div>

          <!-- Entry Price & Stop Loss Price -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label id="label-entry" class="block text-xs font-bold tracking-wider mb-1.5 text-emerald-600 dark:text-emerald-400">
                진입가 ($)
              </label>
              <input
                id="input-entry"
                type="text"
                inputmode="decimal"
                value="100"
                class="w-full border rounded-xl py-3.5 px-3.5 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 transition-all bg-emerald-500/10 border-emerald-500/30 text-emerald-600 dark:text-emerald-400 focus:ring-emerald-500"
                placeholder="0"
              />
            </div>
            <div>
              <label id="label-sl" class="block text-xs font-bold tracking-wider mb-1.5 text-rose-600 dark:text-rose-400">
                손절가 ($)
              </label>
              <input
                id="input-sl"
                type="text"
                inputmode="decimal"
                value="95"
                class="w-full border rounded-xl py-3.5 px-3.5 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 transition-all bg-rose-500/10 border-rose-500/30 text-rose-600 dark:text-rose-400 focus:ring-rose-500"
                placeholder="0"
              />
            </div>
          </div>

          <!-- Risk Percentage & Ticker Symbol -->
          <div class="grid grid-cols-12 gap-3">
            <div class="col-span-5">
              <label class="block text-xs font-bold tracking-wider text-neutral-500 dark:text-neutral-400 mb-1.5">
                리스크 (%)
              </label>
              <div class="relative">
                <input
                  id="input-risk"
                  type="text"
                  inputmode="decimal"
                  value="1"
                  class="w-full bg-white dark:bg-black border border-neutral-200 dark:border-neutral-800 rounded-xl py-3.5 pl-3.5 pr-8 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white transition-all"
                  placeholder="1"
                />
                <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-neutral-400 font-bold">%</span>
              </div>
            </div>
            <div class="col-span-7">
              <label class="block text-xs font-bold tracking-wider text-neutral-500 dark:text-neutral-400 mb-1.5">
                종목명 (선택)
              </label>
              <input
                id="input-symbol"
                type="text"
                class="w-full bg-white dark:bg-black border border-neutral-200 dark:border-neutral-800 rounded-xl py-3.5 px-3.5 text-lg font-bold focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white transition-all"
                placeholder="NVDA / BTC"
              />
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex space-x-2.5 pt-2">
            <button
              id="btn-calc"
              class="flex-1 bg-neutral-900 hover:bg-neutral-800 dark:bg-white dark:hover:bg-neutral-200 text-white dark:text-black font-extrabold py-4 rounded-xl transition-all active:scale-[0.98]"
            >
              몇 주 살지 계산
            </button>
            <button
              id="btn-reset"
              class="px-5 bg-white hover:bg-neutral-100 dark:bg-neutral-900 dark:hover:bg-neutral-800 text-neutral-700 dark:text-neutral-300 border border-neutral-200 dark:border-neutral-800 font-bold rounded-xl transition-all active:scale-[0.98]"
            >
              초기화
            </button>
          </div>
        </div>

      </div>

      <!-- RIGHT COLUMN: STEP 3 Results & STEP 4 Trade Log -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- STEP 3: Primary Result Card -->
        <div class="bg-neutral-950 dark:bg-neutral-900 text-white rounded-3xl p-7 sm:p-8 border border-neutral-800 relative overflow-hidden">
          
          <!-- Validation Error Display -->
          <div id="result-error" class="hidden flex-col items-center justify-center py-10 text-rose-400">
            <svg class="w-11 h-11 mb-3 opacity-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
            </svg>
            <p id="error-text" class="text-center font-bold text-lg"></p>
          </div>

          <!-- Calculation Result Display -->
          <div id="result-content">
            <div class="flex items-center justify-between mb-2">
              <span class="text-neutral-400 font-bold text-sm tracking-wider uppercase">매수 가능 수량</span>
              <span id="res-max-loss-badge" class="text-xs font-bold px-2.5 py-1 rounded-md bg-neutral-800 text-neutral-300">
                최대 손실: $10
              </span>
            </div>

            <div class="flex items-baseline mb-8">
              <span id="res-size" class="text-6xl sm:text-7xl md:text-8xl font-black tracking-tighter text-white">2</span>
              <span id="res-unit" class="text-2xl sm:text-3xl font-bold ml-2.5 text-neutral-400">주</span>
            </div>

            <!-- Margin Exceeded Warning Banner (Crypto) -->
            <div id="margin-warning" class="hidden mb-6 p-4 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-300 text-sm flex items-start space-x-3">
              <svg class="w-5 h-5 flex-shrink-0 text-amber-400 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
              </svg>
              <div>
                <p class="font-bold">필요 증거금이 현재 잔고를 초과합니다.</p>
                <p class="text-amber-200/80 text-xs mt-1">레버리지를 높이거나 가용 잔고 한도 내 수량으로 줄여 진입하세요.</p>
              </div>
            </div>

            <!-- Detailed Metrics Grid -->
            <div id="res-grid" class="grid grid-cols-2 gap-4 sm:gap-6 pt-6 border-t border-neutral-800">
              <div>
                <p class="text-neutral-400 text-xs font-bold mb-1">주당 위험</p>
                <p id="res-rps" class="text-xl sm:text-2xl font-extrabold text-white">$5</p>
              </div>
              <div>
                <p class="text-neutral-400 text-xs font-bold mb-1">총 매수금액</p>
                <p id="res-total" class="text-xl sm:text-2xl font-extrabold text-white">$200</p>
              </div>
              <div id="res-margin-box" class="hidden">
                <p class="text-neutral-400 text-xs font-bold mb-1">필요 증거금</p>
                <p id="res-margin" class="text-xl sm:text-2xl font-extrabold text-emerald-400">0 USDT</p>
              </div>
            </div>
          </div>

        </div>

        <!-- STEP 4: Trade Record Save & Trade Log -->
        <div class="bg-neutral-50 dark:bg-neutral-950 rounded-2xl p-5 sm:p-6 border border-neutral-200 dark:border-neutral-800">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-extrabold text-base tracking-tight uppercase">TRADE LOG · 거래기록</h3>
            <span class="text-xs text-neutral-500">로컬 브라우저 자동 저장</span>
          </div>

          <div class="space-y-3 mb-6">
            <textarea
              id="input-memo"
              maxlength="2000"
              rows="2"
              placeholder="진입 근거 및 차트 메모 (최대 2,000자)"
              class="w-full bg-white dark:bg-black border border-neutral-200 dark:border-neutral-800 rounded-xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white resize-y"
            ></textarea>
            <button
              id="btn-save"
              class="w-full bg-neutral-900 hover:bg-neutral-800 dark:bg-white dark:hover:bg-neutral-200 text-white dark:text-black font-bold py-3 rounded-xl text-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed"
            >
              현재 포지션 기록 저장
            </button>
          </div>

          <div id="trade-log-list" class="space-y-3">
            <!-- Logs rendered here -->
          </div>
        </div>

      </div>
    </div>
    
    <!-- Risk Discipline Footer -->
    <footer class="mt-16 pt-8 border-t border-neutral-200 dark:border-neutral-800 text-center pb-10">
      <p class="text-xs font-black tracking-widest text-neutral-400 mb-2 uppercase">RISK DISCIPLINE</p>
      <p class="text-base sm:text-xl font-bold text-neutral-800 dark:text-neutral-200">
        손절 위치는 차트 구조가 결정하고, 포지션 크기는 리스크가 결정한다.
      </p>
    </footer>

  </main>

  <script>
    // --- Market Presets (Prompt Section 19 Examples) ---
    const MARKET_PRESETS = {
      KR: {
        balance: '20,000,000',
        leverage: '1',
        entry: '200,000',
        stopLoss: '180,000',
        risk: '1'
      },
      US: {
        balance: '1,000',
        leverage: '1',
        entry: '100',
        stopLoss: '95',
        risk: '1'
      },
      CRYPTO: {
        balance: '1,000',
        leverage: '10',
        entry: '78,000.0',
        stopLoss: '77,400.0',
        risk: '1'
      }
    };

    // --- State ---
    const state = {
      market: 'US', // KR, US, CRYPTO
      position: 'LONG', // LONG, SHORT
      balances: {
        KR: MARKET_PRESETS.KR.balance,
        US: MARKET_PRESETS.US.balance,
        CRYPTO: MARKET_PRESETS.CRYPTO.balance
      },
      size: null,
      hasError: false,
      tradeLog: []
    };

    // Load saved balances and logs
    try {
      const savedBalances = localStorage.getItem('psc_market_balances_v2');
      if (savedBalances) state.balances = { ...state.balances, ...JSON.parse(savedBalances) };
      const savedLogs = localStorage.getItem('psc_trade_logs_v2');
      if (savedLogs) state.tradeLog = JSON.parse(savedLogs);
    } catch (e) {}

    // --- DOM Elements ---
    const elThemeToggle = document.getElementById('theme-toggle');
    const elIconSun = document.getElementById('icon-sun');
    const elIconMoon = document.getElementById('icon-moon');
    const elMarketBtns = document.querySelectorAll('.market-btn');
    const elPosBtns = document.querySelectorAll('.pos-btn');
    const elBalanceLabel = document.getElementById('balance-label');
    const elInputBalance = document.getElementById('input-balance');
    const elInputLeverage = document.getElementById('input-leverage');
    const elLabelEntry = document.getElementById('label-entry');
    const elInputEntry = document.getElementById('input-entry');
    const elLabelSl = document.getElementById('label-sl');
    const elInputSl = document.getElementById('input-sl');
    const elInputRisk = document.getElementById('input-risk');
    const elInputSymbol = document.getElementById('input-symbol');
    const elBtnCalc = document.getElementById('btn-calc');
    const elBtnReset = document.getElementById('btn-reset');
    const elResultError = document.getElementById('result-error');
    const elErrorText = document.getElementById('error-text');
    const elResultContent = document.getElementById('result-content');
    const elResMaxLossBadge = document.getElementById('res-max-loss-badge');
    const elResSize = document.getElementById('res-size');
    const elResUnit = document.getElementById('res-unit');
    const elMarginWarning = document.getElementById('margin-warning');
    const elResGrid = document.getElementById('res-grid');
    const elResRps = document.getElementById('res-rps');
    const elResTotal = document.getElementById('res-total');
    const elResMarginBox = document.getElementById('res-margin-box');
    const elResMargin = document.getElementById('res-margin');
    const elInputMemo = document.getElementById('input-memo');
    const elBtnSave = document.getElementById('btn-save');
    const elTradeLogList = document.getElementById('trade-log-list');

    // --- Formatting & Sanitization Helpers ---
    function addCommas(str) {
      if (str === null || str === undefined || str === '') return '';
      const parts = str.toString().split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts.join('.');
    }

    function removeCommas(str) {
      if (!str) return '';
      return str.toString().replace(/,/g, '');
    }

    function sanitizeNumericInput(val) {
      let clean = val.replace(/[^0-9.]/g, '');
      const dotIndex = clean.indexOf('.');
      if (dotIndex !== -1) {
        clean = clean.slice(0, dotIndex + 1) + clean.slice(dotIndex + 1).replace(/\./g, '');
      }
      return clean;
    }

    function formatNumber(num, maxDecimals = 2) {
      if (num === null || num === undefined || isNaN(num)) return '-';
      return Number(num).toLocaleString('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: maxDecimals,
      });
    }

    function getUnitLabel() {
      if (state.market === 'KR') return '₩';
      if (state.market === 'US') return '$';
      return 'USDT';
    }

    function formatMoney(num, maxDecimals = 2) {
      if (num === null || num === undefined || isNaN(num)) return '-';
      const formatted = formatNumber(num, maxDecimals);
      if (state.market === 'KR') return `${formatted}₩`;
      if (state.market === 'US') return `$${formatted}`;
      return `${formatted} USDT`;
    }

    // --- Market & Position Switch Handlers ---
    function switchMarket(newMarket) {
      state.market = newMarket;
      const preset = MARKET_PRESETS[newMarket];

      elMarketBtns.forEach(btn => {
        if (btn.dataset.market === newMarket) {
          btn.className = 'market-btn py-3 px-2 rounded-xl font-bold text-sm transition-all bg-neutral-900 text-white dark:bg-white dark:text-black shadow-sm';
        } else {
          btn.className = 'market-btn py-3 px-2 rounded-xl font-bold text-sm transition-all bg-white dark:bg-neutral-900 text-neutral-500 border border-neutral-200 dark:border-neutral-800';
        }
      });

      const unit = getUnitLabel();
      elBalanceLabel.textContent = `현재 잔고 (${unit})`;
      elLabelEntry.textContent = `진입가 (${unit})`;
      elLabelSl.textContent = `손절가 (${unit})`;

      // Restore user's separate balance for this market
      elInputBalance.value = state.balances[newMarket] || preset.balance;
      elInputEntry.value = preset.entry;
      elInputSl.value = preset.stopLoss;
      elInputRisk.value = preset.risk;

      if (newMarket === 'CRYPTO') {
        elInputLeverage.disabled = false;
        elInputLeverage.value = preset.leverage;
        elResUnit.textContent = '';
        elResGrid.className = 'grid grid-cols-3 gap-3 sm:gap-6 pt-6 border-t border-neutral-800';
        elResMarginBox.classList.remove('hidden');
      } else {
        elInputLeverage.value = '1';
        elInputLeverage.disabled = true;
        elResUnit.textContent = '주';
        elResGrid.className = 'grid grid-cols-2 gap-4 sm:gap-6 pt-6 border-t border-neutral-800';
        elResMarginBox.classList.add('hidden');
        elMarginWarning.classList.add('hidden');
      }

      calculate();
    }

    function updatePositionUI() {
      const isLong = state.position === 'LONG';

      elPosBtns.forEach(btn => {
        const pos = btn.dataset.pos;
        if (pos === 'LONG') {
          btn.className = isLong
            ? 'pos-btn py-3 rounded-xl font-bold text-sm transition-all border-2 border-emerald-500 text-emerald-600 dark:text-emerald-400 bg-emerald-500/10'
            : 'pos-btn py-3 rounded-xl font-bold text-sm transition-all border-2 border-transparent text-neutral-500 bg-white dark:bg-neutral-900 border-neutral-200 dark:border-neutral-800';
        } else {
          btn.className = !isLong
            ? 'pos-btn py-3 rounded-xl font-bold text-sm transition-all border-2 border-rose-500 text-rose-600 dark:text-rose-400 bg-rose-500/10'
            : 'pos-btn py-3 rounded-xl font-bold text-sm transition-all border-2 border-transparent text-neutral-500 bg-white dark:bg-neutral-900 border-neutral-200 dark:border-neutral-800';
        }
      });

      if (isLong) {
        elLabelEntry.className = 'block text-xs font-bold tracking-wider mb-1.5 text-emerald-600 dark:text-emerald-400';
        elInputEntry.className = 'w-full border rounded-xl py-3.5 px-3.5 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 transition-all bg-emerald-500/10 border-emerald-500/30 text-emerald-600 dark:text-emerald-400 focus:ring-emerald-500';
        elLabelSl.className = 'block text-xs font-bold tracking-wider mb-1.5 text-rose-600 dark:text-rose-400';
        elInputSl.className = 'w-full border rounded-xl py-3.5 px-3.5 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 transition-all bg-rose-500/10 border-rose-500/30 text-rose-600 dark:text-rose-400 focus:ring-rose-500';
      } else {
        elLabelEntry.className = 'block text-xs font-bold tracking-wider mb-1.5 text-rose-600 dark:text-rose-400';
        elInputEntry.className = 'w-full border rounded-xl py-3.5 px-3.5 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 transition-all bg-rose-500/10 border-rose-500/30 text-rose-600 dark:text-rose-400 focus:ring-rose-500';
        elLabelSl.className = 'block text-xs font-bold tracking-wider mb-1.5 text-emerald-600 dark:text-emerald-400';
        elInputSl.className = 'w-full border rounded-xl py-3.5 px-3.5 text-lg sm:text-xl font-extrabold focus:outline-none focus:ring-2 transition-all bg-emerald-500/10 border-emerald-500/30 text-emerald-600 dark:text-emerald-400 focus:ring-emerald-500';
      }

      calculate();
    }

    function showError(msg) {
      state.hasError = true;
      state.size = null;
      elResultContent.classList.add('hidden');
      elResultError.classList.remove('hidden');
      elResultError.classList.add('flex');
      elErrorText.textContent = msg;
      elBtnSave.disabled = true;
    }

    function clearError() {
      state.hasError = false;
      elResultError.classList.add('hidden');
      elResultError.classList.remove('flex');
      elResultContent.classList.remove('hidden');
    }

    // --- Core Position Sizing Calculation ---
    function calculate() {
      const rawBal = removeCommas(elInputBalance.value);
      const rawLev = removeCommas(elInputLeverage.value);
      const rawEnt = removeCommas(elInputEntry.value);
      const rawSl = removeCommas(elInputSl.value);
      const rawRisk = removeCommas(elInputRisk.value);

      const b = parseFloat(rawBal);
      const l = parseFloat(rawLev) || 1;
      const e = parseFloat(rawEnt);
      const sl = parseFloat(rawSl);
      const r = parseFloat(rawRisk);

      // Validation checks (Prompt Section 12)
      if (rawEnt !== '' && (!e || e <= 0)) {
        return showError('올바른 진입가격을 입력해주세요.');
      }
      if (rawSl !== '' && (!sl || sl <= 0)) {
        return showError('올바른 손절가격을 입력해주세요.');
      }
      if (rawRisk !== '' && (isNaN(r) || r <= 0)) {
        return showError('리스크는 0보다 큰 금액을 입력해주세요.');
      }
      if (!isNaN(r) && r >= 100) {
        return showError('리스크는 100보다 작은 값을 입력해주세요.');
      }

      if (!b || b <= 0 || !e || !sl || !r) {
        clearError();
        elResSize.textContent = '0';
        elResRps.textContent = '-';
        elResTotal.textContent = '-';
        elResMargin.textContent = '-';
        elResMaxLossBadge.textContent = '최대 손실: -';
        elMarginWarning.classList.add('hidden');
        elBtnSave.disabled = true;
        return;
      }

      let rps = 0;
      if (state.position === 'LONG') {
        if (sl >= e) {
          return showError('롱 포지션 기준 손절가는 진입가보다 낮아야 합니다.');
        }
        rps = e - sl;
      } else {
        if (e >= sl) {
          return showError('숏 포지션 기준 진입가는 손절가보다 낮아야 합니다.');
        }
        rps = sl - e;
      }

      clearError();

      // Normalized Risk Formula: Allowed Loss = Balance * (Risk / 100)
      const allowedLoss = b * (r / 100);
      const rawSize = allowedLoss / rps;

      // Floor precision: 4 decimal places for Crypto, integer for Stocks
      const calculatedSize = state.market === 'CRYPTO'
        ? Math.floor(rawSize * 10000) / 10000
        : Math.floor(rawSize);

      const totalAmount = calculatedSize * e;
      const marginNeeded = totalAmount / l;
      const exceeded = state.market === 'CRYPTO' && marginNeeded > b;

      state.size = calculatedSize;
      elBtnSave.disabled = false;

      const dec = state.market === 'KR' ? 0 : 4;
      elResMaxLossBadge.textContent = `최대 손실: ${formatMoney(allowedLoss, dec)}`;
      elResSize.textContent = formatNumber(calculatedSize, state.market === 'CRYPTO' ? 4 : 0);
      elResRps.textContent = formatMoney(rps, dec);
      elResTotal.textContent = formatMoney(totalAmount, dec);

      if (state.market === 'CRYPTO') {
        elResMargin.textContent = formatMoney(marginNeeded, 4);
        if (exceeded) {
          elMarginWarning.classList.remove('hidden');
          elResMargin.className = 'text-xl sm:text-2xl font-extrabold text-amber-400';
        } else {
          elMarginWarning.classList.add('hidden');
          elResMargin.className = 'text-xl sm:text-2xl font-extrabold text-emerald-400';
        }
      }
    }

    // --- Trade Log Rendering ---
    function renderTradeLog() {
      if (state.tradeLog.length === 0) {
        elTradeLogList.innerHTML = `
          <div class="text-center py-8 text-neutral-400 border border-dashed border-neutral-200 dark:border-neutral-800 rounded-xl text-sm">
            저장된 거래 기록이 없습니다.
          </div>
        `;
        return;
      }

      elTradeLogList.innerHTML = state.tradeLog.map(trade => {
        const isLong = trade.position === 'LONG';
        const badgeClass = isLong
          ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'
          : 'bg-rose-500/15 text-rose-600 dark:text-rose-400';
        const entryColor = isLong
          ? 'text-emerald-600 dark:text-emerald-400'
          : 'text-rose-600 dark:text-rose-400';
        const slColor = isLong
          ? 'text-rose-600 dark:text-rose-400'
          : 'text-emerald-600 dark:text-emerald-400';

        const unitSuffix = trade.market === 'CRYPTO' ? '' : '주';
        const dec = trade.market === 'KR' ? 0 : 4;

        const escapedMemo = trade.memo
          ? trade.memo.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          : '';

        return `
          <div class="p-4 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-black transition-colors">
            <div class="flex justify-between items-center mb-3">
              <div class="flex items-center space-x-2.5">
                <span class="px-2 py-0.5 rounded text-xs font-black ${badgeClass}">
                  ${trade.position}
                </span>
                <span class="font-extrabold text-base">${trade.symbol}</span>
                <span class="text-xs text-neutral-400">${trade.date}</span>
              </div>
              <button onclick="deleteTrade(${trade.id})" class="text-neutral-400 hover:text-rose-500 p-1 transition-colors" title="삭제">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                </svg>
              </button>
            </div>
            
            <div class="grid grid-cols-4 gap-2 text-xs sm:text-sm">
              <div>
                <p class="text-neutral-400 text-[11px] mb-0.5">진입가</p>
                <p class="font-bold ${entryColor}">${formatNumber(trade.entry, dec)}</p>
              </div>
              <div>
                <p class="text-neutral-400 text-[11px] mb-0.5">손절가</p>
                <p class="font-bold ${slColor}">${formatNumber(trade.stopLoss, dec)}</p>
              </div>
              <div>
                <p class="text-neutral-400 text-[11px] mb-0.5">리스크</p>
                <p class="font-bold">${trade.risk}%</p>
              </div>
              <div>
                <p class="text-neutral-400 text-[11px] mb-0.5">수량</p>
                <p class="font-extrabold text-neutral-900 dark:text-white">${formatNumber(trade.size, trade.market === 'CRYPTO' ? 4 : 0)}${unitSuffix}</p>
              </div>
            </div>

            ${escapedMemo ? `
              <div class="mt-3 pt-2.5 border-t border-neutral-100 dark:border-neutral-900 text-xs sm:text-sm text-neutral-600 dark:text-neutral-400 whitespace-pre-wrap">${escapedMemo}</div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    window.deleteTrade = function(id) {
      state.tradeLog = state.tradeLog.filter(t => t.id !== id);
      try {
        localStorage.setItem('psc_trade_logs_v2', JSON.stringify(state.tradeLog));
      } catch (e) {}
      renderTradeLog();
    };

    // --- Event Listeners ---
    elThemeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      if (isDark) {
        elIconSun.classList.remove('hidden');
        elIconMoon.classList.add('hidden');
      } else {
        elIconSun.classList.add('hidden');
        elIconMoon.classList.remove('hidden');
      }
    });

    elMarketBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        switchMarket(btn.dataset.market);
      });
    });

    elPosBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        state.position = btn.dataset.pos;
        updatePositionUI();
      });
    });

    // Balance input with per-market storage & automatic comma formatting
    elInputBalance.addEventListener('input', (e) => {
      const clean = sanitizeNumericInput(e.target.value);
      const formatted = addCommas(clean);
      e.target.value = formatted;
      state.balances[state.market] = formatted;
      try {
        localStorage.setItem('psc_market_balances_v2', JSON.stringify(state.balances));
      } catch (err) {}
      calculate();
    });

    // Entry & Stop Loss inputs with automatic comma formatting
    [elInputEntry, elInputSl].forEach(input => {
      input.addEventListener('input', (e) => {
        const clean = sanitizeNumericInput(e.target.value);
        e.target.value = addCommas(clean);
        calculate();
      });
    });

    // Leverage & Risk inputs
    [elInputLeverage, elInputRisk].forEach(input => {
      input.addEventListener('input', (e) => {
        const clean = sanitizeNumericInput(e.target.value);
        e.target.value = input === elInputLeverage ? addCommas(clean) : clean;
        calculate();
      });
    });

    elInputSymbol.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    elBtnCalc.addEventListener('click', calculate);

    elBtnReset.addEventListener('click', () => {
      const preset = MARKET_PRESETS[state.market];
      state.balances[state.market] = preset.balance;
      try {
        localStorage.setItem('psc_market_balances_v2', JSON.stringify(state.balances));
      } catch (e) {}
      elInputBalance.value = preset.balance;
      elInputLeverage.value = preset.leverage;
      elInputEntry.value = preset.entry;
      elInputSl.value = preset.stopLoss;
      elInputRisk.value = preset.risk;
      elInputSymbol.value = '';
      elInputMemo.value = '';
      calculate();
    });

    elBtnSave.addEventListener('click', () => {
      if (state.size === null || state.hasError) return;

      const now = new Date();
      const dateStr = now.toLocaleDateString('ko-KR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });

      const defaultSymbol = state.market === 'KR' ? '국내주식' : state.market === 'US' ? '미국주식' : 'CRYPTO';

      const newTrade = {
        id: Date.now(),
        date: dateStr,
        symbol: elInputSymbol.value.trim() || defaultSymbol,
        market: state.market,
        position: state.position,
        entry: parseFloat(removeCommas(elInputEntry.value)),
        stopLoss: parseFloat(removeCommas(elInputSl.value)),
        risk: parseFloat(removeCommas(elInputRisk.value)),
        size: state.size,
        memo: elInputMemo.value.trim()
      };

      state.tradeLog.unshift(newTrade);
      try {
        localStorage.setItem('psc_trade_logs_v2', JSON.stringify(state.tradeLog));
      } catch (e) {}

      elInputMemo.value = '';
      elInputSymbol.value = '';
      renderTradeLog();
    });

    // --- Initial Boot ---
    switchMarket('US');
    updatePositionUI();
    renderTradeLog();
  </script>
</body>
</html>
